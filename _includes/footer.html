<footer class="bg-slate-800 text-white mt-auto">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center text-center md:text-left">
            
            <div>
                <p class="text-slate-400 text-sm mt-1">
                    &copy; {{ "now" | date: "%Y" }} {{ site.name }}
                </p>
            </div>

            <div class="flex justify-center md:justify-end space-x-6 text-sm">
                <a href="mailto:{{ site.email }}" class="hover:text-blue-400 transition-colors">Contact</a>
                <a href="https://linkedin.com/in/{{ site.linkedin_username }}" class="hover:text-blue-400 transition-colors">LinkedIn</a>
                <a href="https://github.com/{{ site.github_username }}" class="hover:text-blue-400 transition-colors">GitHub</a>     
            </div>

        </div>
    </div>
</footer>
