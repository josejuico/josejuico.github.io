        <div class="flex justify-between h-16">
            <div class="flex-shrink-0 flex items-center">
                <a href="{{ '/' | relative_url }}" class="text-2xl font-extrabold text-slate-700 tracking-tight">
                    {{ site.name }}
                </a>
            </div>
            
            <div class="hidden sm:ml-6 sm:flex sm:space-x-4 items-center">
                <a href="{{ '/index.html' | relative_url }}" class="{% if page.url == '/index.html' %}text-gray-900 border-b-2 border-blue-900{% else %}text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900{% endif %} px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Home</a>
                <a href="{{ '/resume.html' | relative_url }}" class="{% if page.url == '/resume.html' %}text-gray-900 border-b-2 border-blue-900{% else %}text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900{% endif %} px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Resume</a>
                <a href="{{ '/projects.html' | relative_url }}" class="{% if page.url == '/projects.html' %}text-gray-900 border-b-2 border-blue-900{% else %}text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900{% endif %} px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Projects</a>
                <a href="{{ '/playground.html' | relative_url }}" class="{% if page.url contains '/playground' %}text-gray-900 border-b-2 border-blue-900{% else %}text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900{% endif %} px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Developer Playground</a>
            </div>
            
            <div class="-mr-2 flex items-center sm:hidden">
                <button id="mobile-menu-button" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-900" aria-controls="mobile-menu" aria-expanded="false">
                    <svg class="block h-6 w-6" id="menu-icon-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    <svg class="hidden h-6 w-6" id="menu-icon-close" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <div class="hidden sm:hidden" id="mobile-menu">
        <div class="px-2 pt-2 pb-3 space-y-1">
            <a href="{{ '/index.html' | relative_url }}" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Home</a>
            <a href="{{ '/resume.html' | relative_url }}" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Resume</a>
            <a href="{{ '/projects.html' | relative_url }}" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Projects</a>
            <a href="{{ '/playground.html' | relative_url }}" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Developer Playground</a>
        </div>
    </div>
</nav>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const button = document.getElementById('mobile-menu-button');
        const menu = document.getElementById('mobile-menu');
        const iconOpen = document.getElementById('menu-icon-open');
        const iconClose = document.getElementById('menu-icon-close');

        if (button && menu) {
            button.addEventListener('click', () => {
                const isHidden = menu.classList.contains('hidden');
                
                if (!isHidden) {
                    // Close mobile menu
                    menu.classList.add('hidden');
                    iconOpen.classList.remove('hidden');
                    iconClose.classList.add('hidden');
                    button.setAttribute('aria-expanded', 'false');
                } else {
                    // Open mobile menu
                    menu.classList.remove('hidden');
                    iconOpen.classList.add('hidden');
                    iconClose.classList.remove('hidden');
                    button.setAttribute('aria-expanded', 'true');
                }
            });
        }
    });
</script>
