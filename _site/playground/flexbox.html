<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Visualizer | Jose Juico</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc; 
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        .animate-fadeInUp {
            opacity: 0;
            animation: fadeInUp 0.7s ease-out forwards;
            animation-delay: 0.2s;
        }

        /* Hide scrollbar for horizontal scrolling elements in modules */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased text-slate-900">

    <main class="flex-grow w-full max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-10 animate-fadeInUp">
        <header class="mb-6 sm:mb-10 text-center sm:text-left">
    <div class="flex items-center justify-between mb-2">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight">Flexbox Visualizer</h1>
        <a href="/playground.html" class="group flex items-center text-xs sm:text-sm font-medium text-slate-500 hover:text-blue-900 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1 transform group-hover:-translate-x-1 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
            </svg>
            Back to Playground
        </a>
    </div>
    <p class="text-sm sm:text-base text-slate-500"><code>justify-content</code> aligns items when they do no use all available space on the horizontal axis.</p>
</header>

<div class="mb-8">
    <label class="block text-[10px] sm:text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Alignment Property</label>
    <div class="bg-slate-200 p-1 rounded-xl flex space-x-1 overflow-x-auto scrollbar-hide">
        <button onclick="updateFlex('flex-start', this)" class="segmented-btn bg-white text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold shadow-sm transition-all flex-shrink-0">flex-start</button>
        <button onclick="updateFlex('flex-end', this)" class="segmented-btn text-slate-600 hover:text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex-shrink-0">flex-end</button>
        <button onclick="updateFlex('center', this)" class="segmented-btn text-slate-600 hover:text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex-shrink-0">center</button>
        <button onclick="updateFlex('space-between', this)" class="segmented-btn text-slate-600 hover:text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex-shrink-0">space-between</button>
        <button onclick="updateFlex('space-around', this)" class="segmented-btn text-slate-600 hover:text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex-shrink-0">space-around</button>
        <button onclick="updateFlex('space-evenly', this)" class="segmented-btn text-slate-600 hover:text-slate-900 px-3 sm:px-4 py-2 rounded-lg text-xs sm:text-sm font-semibold transition-all flex-shrink-0">space-evenly</button>
    </div>
</div>

<div class="bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden w-full">
    <div id="flex-stage" class="flex flex-nowrap h-32 sm:h-48 bg-blue-900 p-4 sm:p-6 transition-all duration-500 ease-in-out overflow-x-hidden w-full" style="justify-content: flex-start;">
        <div class="flex items-center justify-center h-full w-16 sm:w-20 min-w-0 flex-shrink-1 bg-yellow-500 rounded-lg sm:rounded-xl border-2 sm:border-4 border-yellow-400/50 shadow-lg">
            <span class="text-[10px] sm:text-xs font-extrabold text-blue-950 text-center">w-20</span>
        </div>
        <div class="flex items-center justify-center h-full w-12 sm:w-14 min-w-0 flex-shrink-1 bg-yellow-500 rounded-lg sm:rounded-xl border-2 sm:border-4 border-yellow-400/50 shadow-lg mx-2">
            <span class="text-[10px] sm:text-xs font-extrabold text-blue-950 text-center">w-14</span>
        </div>
        <div class="flex items-center justify-center h-full w-24 sm:w-40 min-w-0 flex-shrink-1 bg-yellow-500 rounded-lg sm:rounded-xl border-2 sm:border-4 border-yellow-400/50 shadow-lg">
            <span class="text-[10px] sm:text-xs font-extrabold text-blue-950 text-center">w-40</span>
        </div>
    </div>
    
    <div class="p-4 sm:p-6 bg-white border-t border-slate-100">
        <div class="flex items-center space-x-2 text-blue-900 mb-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="prop-title" class="font-bold uppercase text-[10px] sm:text-xs tracking-tighter">flex-start</span>
        </div>
        <p id="prop-desc" class="text-slate-600 text-[10px] sm:text-sm leading-relaxed italic">Items are packed toward the start of the flex-direction.</p>
    </div>
</div>

<script>
    const descriptions = {
        'flex-start': 'Items are packed toward the start of the flex-direction.',
        'flex-end': 'Items are packed toward the end of the flex-direction.',
        'center': 'Items are centered along the line.',
        'space-between': 'Items are evenly distributed; first item is at the start, last item at the end.',
        'space-around': 'Items are evenly distributed with equal space around them.',
        'space-evenly': 'Items are distributed so that the spacing between any two items is equal.'
    };

    function updateFlex(value, el) {
        const stage = document.getElementById('flex-stage');
        const title = document.getElementById('prop-title');
        const desc = document.getElementById('prop-desc');
        
        stage.style.justifyContent = value;
        title.innerText = value;
        desc.innerText = descriptions[value];

        document.querySelectorAll('.segmented-btn').forEach(btn => {
            btn.classList.remove('bg-white', 'text-slate-900', 'shadow-sm');
            btn.classList.add('text-slate-600');
        });
        el.classList.add('bg-white', 'text-slate-900', 'shadow-sm');
        el.classList.remove('text-slate-600');
    }
</script>
    </main>

    <footer class="bg-slate-800 text-white mt-auto">
    <div class="max-w-7xl mx-auto py-8 px-4 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 items-center text-center md:text-left">
            
            <div>
                <p class="text-slate-400 text-sm mt-1">
                    &copy; 2026 Jose Juico
                </p>
            </div>

            <div class="flex justify-center md:justify-end space-x-6 text-sm">
                <a href="mailto:josejuico@gmail.com" class="hover:text-blue-400 transition-colors">Contact</a>
                <a href="https://linkedin.com/in/josejuico" class="hover:text-blue-400 transition-colors">LinkedIn</a>
                <a href="https://github.com/josejuico" class="hover:text-blue-400 transition-colors">GitHub</a>     
            </div>

        </div>
    </div>
</footer>

    <script src="/assets/js/main.js"></script>
</body>
</html>
