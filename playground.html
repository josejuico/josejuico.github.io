<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Playground | Jose Juico</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7fafc; 
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate3d(0, 20px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }
        .animate-fadeInUp {
            opacity: 0;
            animation: fadeInUp 0.7s ease-out forwards;
            animation-delay: 0.2s;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

    <!-- Navigation Bar -->
    <nav id="navbar" class="bg-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex-shrink-0 flex items-center">
                    <a href="index.html" class="text-2xl font-extrabold text-slate-700 tracking-tight">
                        Jose Juico
                    </a>
                </div>
                
                <!-- Desktop Navigation Links -->
                <div class="hidden sm:ml-6 sm:flex sm:space-x-4 items-center">
                    <a href="index.html" class="text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900 px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Home</a>
                    <a href="resume.html" class="text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900 px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Resume</a>
                    <a href="projects.html" class="text-gray-500 hover:text-gray-900 hover:border-b-2 hover:border-blue-900 px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Projects</a>
                    <a href="playground.html" class="text-gray-900 border-b-2 border-blue-900 px-3 py-2 text-sm font-medium transition duration-150 ease-in-out">Developer Playground</a>
                </div>
                
                <!-- Mobile Menu Button -->
                <div class="-mr-2 flex items-center sm:hidden">
                    <button id="mobile-menu-button" type="button" class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-900" aria-controls="mobile-menu" aria-expanded="false">
                        <!-- Menu closed icon (bars) -->
                        <svg class="block h-6 w-6" id="menu-icon-open" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                        <!-- Menu open icon (x) -->
                        <svg class="hidden h-6 w-6" id="menu-icon-close" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu -->
        <div class="sm:hidden" id="mobile-menu" style="display: none;">
            <div class="px-2 pt-2 pb-3 space-y-1">
                <a href="index.html" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Home</a>
                <a href="resume.html" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Resume</a>
                <a href="projects.html" class="text-gray-700 hover:bg-gray-50 hover:border-l-4 hover:border-blue-900 block px-3 py-2 rounded-md text-base font-medium">Projects</a>
                <a href="playground.html" class="bg-slate-50 border-l-4 border-blue-900 block px-3 py-2 rounded-md text-base font-medium text-slate-700">Developer Playground</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
<main class="flex-grow max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-10 animate-fadeInUp">
    
    <header class="text-center pb-4 mb-8 border-b-2 border-slate-300">
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight">Developer Playground</h1>
        <p class="text-lg text-slate-600 mt-2">Side Projects and Software Experiments</p>
    </header>

    <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-8 md:p-12 text-center">
        <div class="flex justify-center mb-6">
            <div class="p-4 bg-blue-50 rounded-full animate-pulse">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-blue-900" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z" />
                </svg>
            </div>
        </div>
        
        <h2 class="text-2xl font-bold text-slate-800 mb-4">Under Construction</h2>
        <p class="text-slate-600 max-w-lg mx-auto mb-8 leading-relaxed">
            This page will soon feature additional side projects and fun code experiments.
        </p>
        
        <div class="mt-10">
            <a href="projects.html" class="inline-flex items-center text-sm font-semibold text-blue-900 hover:text-blue-700 transition-colors">
                View current projects
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 ml-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </div>

</main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-12">
        <div class="max-w-7xl mx-auto py-4 px-4 sm:px-6 lg:px-8 text-center text-sm">
            &copy; 2025 Jose Juico
        </div>
    </footer>

    <!-- JavaScript for Mobile Menu Toggle -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('mobile-menu-button');
            const menu = document.getElementById('mobile-menu');
            const iconOpen = document.getElementById('menu-icon-open');
            const iconClose = document.getElementById('menu-icon-close');

            if (button && menu) {
                button.addEventListener('click', () => {
                    const isExpanded = menu.style.display === 'block';
                    
                    if (isExpanded) {
                        menu.style.display = 'none';
                        iconOpen.classList.remove('hidden');
                        iconClose.classList.add('hidden');
                        button.setAttribute('aria-expanded', 'false');
                    } else {
                        menu.style.display = 'block';
                        iconOpen.classList.add('hidden');
                        iconClose.classList.remove('hidden');
                        button.setAttribute('aria-expanded', 'true');
                    }
                });
            }
        });
    </script>
</body>
</html>
